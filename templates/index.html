<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TNEA AI Assistant</title>

    <style>

        /* =========================
           COLOR PALETTE
           =========================

           Cream       #FFF8EE
           Sage        #A8C3A0
           Dark Green  #24433A
           Brown       #8B5E3C
           Gold        #D9A441
        */


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #FFF8EE;

            min-height: 100vh;

            color: #24433A;

        }


        /* =========================
           MAIN APP
           ========================= */

        .app {

            width: 95%;

            max-width: 1450px;

            height: 94vh;

            margin: 3vh auto;

            background: #FFFFFF;

            border-radius: 28px;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            box-shadow:
                0 20px 60px rgba(36, 67, 58, 0.18);

        }


        /* =========================
           HEADER
           ========================= */

        .header {

            background:
                linear-gradient(
                    135deg,
                    #24433A,
                    #315B4E
                );

            color: white;

            padding: 22px 35px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            min-height: 120px;

        }


        .header-left {

            display: flex;

            align-items: center;

            gap: 20px;

        }


        /* KOYA IMAGE */

        .koya-header {

            width: 78px;

            height: 78px;

            min-width: 78px;

            border-radius: 22px;

            object-fit: cover;

            display: block;

            border: 4px solid #A8C3A0;

            background: #FFF8EE;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.25);

        }


        .title h1 {

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 7px;

        }


        .title p {

            font-size: 16px;

            color: #DDEBDD;

        }


        /* =========================
           STATUS
           ========================= */

        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 16px;

        }


        .status-dot {

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: #7ED957;

        }


        /* =========================
           CHAT AREA
           ========================= */

        .chat-area {

            flex: 1;

            overflow-y: auto;

            padding: 35px;

            background: #FFF8EE;

        }


        /* =========================
           WELCOME
           ========================= */

        .welcome {

            min-height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        /* LARGE KOYA */

        .koya-welcome {

            width: 190px;

            height: 190px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border: 7px solid #A8C3A0;

            box-shadow:
                0 15px 40px rgba(36,67,58,0.25);

            margin-bottom: 25px;

            background: white;

        }


        .welcome h2 {

            font-size: 36px;

            color: #24433A;

            margin-bottom: 12px;

        }


        .welcome p {

            font-size: 18px;

            color: #6B7F76;

        }


        /* =========================
           MESSAGES
           ========================= */

        .message {

            display: flex;

            align-items: flex-end;

            gap: 12px;

            margin-bottom: 20px;

        }


        .message.user {

            justify-content: flex-end;

        }


        .message.bot {

            justify-content: flex-start;

        }


        .bot-avatar {

            width: 48px;

            height: 48px;

            min-width: 48px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border: 3px solid #A8C3A0;

        }


        .message-content {

            max-width: 70%;

            padding: 14px 18px;

            font-size: 16px;

            line-height: 1.6;

            border-radius: 18px;

        }


        .bot-content {

            background: white;

            color: #24433A;

            border: 1px solid #DDE8D9;

            border-bottom-left-radius: 5px;

            box-shadow:
                0 4px 12px rgba(36,67,58,0.08);

        }


        .user-content {

            background: #8B5E3C;

            color: white;

            border-bottom-right-radius: 5px;

        }


        /* =========================
           QUICK QUESTIONS
           ========================= */

        .quick-area {

            padding: 20px 35px;

            background: #FFFFFF;

            border-top: 1px solid #E8E0D5;

        }


        .quick-title {

            color: #6B7F76;

            font-size: 14px;

            margin-bottom: 12px;

            font-weight: 600;

        }


        .quick-buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .quick-button {

            padding: 11px 18px;

            border-radius: 25px;

            border: 1px solid #A8C3A0;

            background: #F2F7F0;

            color: #315B4E;

            cursor: pointer;

            font-size: 14px;

            transition: 0.2s;

        }


        .quick-button:hover {

            background: #A8C3A0;

            color: #24433A;

            transform: translateY(-2px);

        }


        /* =========================
           INPUT AREA
           ========================= */

        .input-area {

            padding: 18px 30px 25px;

            background: #FFFFFF;

            display: flex;

            gap: 12px;

        }


        #user-input {

            flex: 1;

            height: 60px;

            border: 2px solid #DDE8D9;

            border-radius: 18px;

            padding: 0 20px;

            outline: none;

            font-size: 16px;

            color: #24433A;

            background: #FFFDF9;

        }


        #user-input:focus {

            border-color: #A8C3A0;

            box-shadow:
                0 0 0 3px rgba(168,195,160,0.2);

        }


        #user-input::placeholder {

            color: #98A59F;

        }


        #send-button {

            width: 62px;

            height: 60px;

            border: none;

            border-radius: 18px;

            background: #24433A;

            color: white;

            font-size: 25px;

            cursor: pointer;

            transition: 0.2s;

        }


        #send-button:hover {

            background: #8B5E3C;

            transform: translateY(-2px);

        }


        /* =========================
           TYPING
           ========================= */

        .typing {

            color: #6B7F76;

            font-size: 14px;

            margin-left: 60px;

            margin-bottom: 15px;

        }


        /* =========================
           SCROLLBAR
           ========================= */

        .chat-area::-webkit-scrollbar {

            width: 8px;

        }


        .chat-area::-webkit-scrollbar-thumb {

            background: #A8C3A0;

            border-radius: 10px;

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .app {

                width: 100%;

                height: 100vh;

                margin: 0;

                border-radius: 0;

            }


            .header {

                padding: 15px;

            }


            .koya-header {

                width: 60px;

                height: 60px;

                min-width: 60px;

            }


            .title h1 {

                font-size: 20px;

            }


            .title p {

                font-size: 12px;

            }


            .status {

                display: none;

            }


            .chat-area {

                padding: 20px;

            }


            .koya-welcome {

                width: 140px;

                height: 140px;

            }


            .welcome h2 {

                font-size: 27px;

            }


            .welcome p {

                font-size: 15px;

            }


            .message-content {

                max-width: 80%;

            }


            .quick-area {

                padding: 15px;

            }


            .input-area {

                padding: 12px;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =================================
         HEADER
         ================================= -->

    <header class="header">


        <div class="header-left">


            <!-- Koya -->

            <img
                src="{{ url_for('static', filename='koya.jpg') }}"
                class="koya-header"
                alt="TNEA Koya Assistant">


            <div class="title">

                <h1>
                    TNEA Counselling Assistant
                </h1>

                <p>
                    Tamil Nadu Engineering Admissions
                </p>

            </div>


        </div>


        <div class="status">

            <span class="status-dot"></span>

            Online

        </div>


    </header>



    <!-- =================================
         CHAT AREA
         ================================= -->

    <main
        class="chat-area"
        id="chat-box">


        <!-- WELCOME -->

        <div
            class="welcome"
            id="welcome">


            <!-- LARGE KOYA -->

            <img
                src="{{ url_for('static', filename='koya.jpg') }}"
                class="koya-welcome"
                alt="Koya">


            <h2>
                Welcome to TNEA Assistant
            </h2>


            <p>
                Ask me about colleges, branches, cutoffs and counselling.
            </p>


        </div>


    </main>



    <!-- =================================
         QUICK QUESTIONS
         ================================= -->

    <section class="quick-area">


        <div class="quick-title">

            Quick Questions

        </div>


        <div class="quick-buttons">


            <button
                class="quick-button"
                onclick="askQuestion('What is TNEA?')">

                What is TNEA?

            </button>


            <button
                class="quick-button"
                onclick="askQuestion('What is cutoff?')">

                What is cutoff?

            </button>


            <button
                class="quick-button"
                onclick="askQuestion('What engineering branches are available?')">

                Branches

            </button>


            <button
                class="quick-button"
                onclick="askQuestion('What colleges are available through TNEA?')">

                Colleges

            </button>


            <button
                class="quick-button"
                onclick="askQuestion('Explain the TNEA counselling process')">

                Counselling Process

            </button>


        </div>


    </section>



    <!-- =================================
         INPUT
         ================================= -->

    <section class="input-area">


        <input
            type="text"
            id="user-input"
            placeholder="Ask your TNEA question..."
            autocomplete="off">


        <button
            id="send-button"
            onclick="sendMessage()">

            ➤

        </button>


    </section>


</div>



<script>


    /* =====================================
       SEND MESSAGE
       ===================================== */

    async function sendMessage() {


        const input =
            document.getElementById("user-input");


        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        const welcome =
            document.getElementById("welcome");


        if (welcome) {

            welcome.remove();

        }


        addMessage(
            message,
            "user"
        );


        input.value = "";


        const chatBox =
            document.getElementById("chat-box");


        const typing =
            document.createElement("div");


        typing.className =
            "typing";


        typing.id =
            "typing";


        typing.innerText =
            "🐨 Koya is thinking...";


        chatBox.appendChild(
            typing
        );


        chatBox.scrollTop =
            chatBox.scrollHeight;


        try {


            const response =
                await fetch(
                    "/chat",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            message:
                                message

                        })

                    }
                );


            const data =
                await response.json();


            const typingElement =
                document.getElementById(
                    "typing"
                );


            if (typingElement) {

                typingElement.remove();

            }


            addMessage(
                data.reply ||
                "I couldn't generate a response.",
                "bot"
            );


        }

        catch (error) {


            const typingElement =
                document.getElementById(
                    "typing"
                );


            if (typingElement) {

                typingElement.remove();

            }


            addMessage(
                "Sorry, I couldn't connect to the TNEA chatbot.",
                "bot"
            );


            console.error(error);

        }

    }



    /* =====================================
       ADD MESSAGE
       ===================================== */

    function addMessage(
        message,
        sender
    ) {


        const chatBox =
            document.getElementById(
                "chat-box"
            );


        const messageDiv =
            document.createElement(
                "div"
            );


        messageDiv.className =
            "message " + sender;


        if (sender === "bot") {


            const avatar =
                document.createElement(
                    "img"
                );


            avatar.src =
                "/static/koya.jpg";


            avatar.className =
                "bot-avatar";


            avatar.alt =
                "Koya";


            messageDiv.appendChild(
                avatar
            );


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "message-content bot-content";


            content.innerText =
                message;


            messageDiv.appendChild(
                content
            );


        }

        else {


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "message-content user-content";


            content.innerText =
                message;


            messageDiv.appendChild(
                content
            );

        }


        chatBox.appendChild(
            messageDiv
        );


        chatBox.scrollTop =
            chatBox.scrollHeight;

    }



    /* =====================================
       QUICK QUESTIONS
       ===================================== */

    function askQuestion(question) {


        const input =
            document.getElementById(
                "user-input"
            );


        input.value =
            question;


        sendMessage();

    }



    /* =====================================
       ENTER KEY
       ===================================== */

    document
        .getElementById("user-input")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );


</script>


</body>

</html>
