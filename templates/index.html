<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TNEA Counselling Assistant</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #eef3ff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: background 0.3s ease;
        }

        /* =========================
           MAIN APP
        ========================= */

        .app {
            width: 95%;
            max-width: 1100px;
            height: 92vh;

            background: white;

            border-radius: 22px;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.15);

            transition: background 0.3s ease;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;

            padding: 18px 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .header-left {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .logo {

            width: 50px;
            height: 50px;

            border-radius: 14px;

            background: rgba(255,255,255,0.2);

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 28px;
        }


        .header-title h1 {

            font-size: 21px;

            margin-bottom: 4px;
        }


        .header-title p {

            font-size: 13px;

            opacity: 0.85;
        }


        /* =========================
           HEADER RIGHT
        ========================= */

        .header-right {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .online {

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 13px;
        }


        .online-dot {

            width: 9px;
            height: 9px;

            background: #22c55e;

            border-radius: 50%;
        }


        .header-button {

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 10px;

            background: rgba(255,255,255,0.15);

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }


        .header-button:hover {

            background: rgba(255,255,255,0.3);

            transform: translateY(-2px);
        }


        /* =========================
           CHAT AREA
        ========================= */

        .chat-area {

            flex: 1;

            overflow-y: auto;

            padding: 30px;

            background: #f8faff;

            transition: background 0.3s ease;
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {

            text-align: center;

            padding: 45px 20px;
        }


        .welcome-icon {

            font-size: 55px;

            margin-bottom: 15px;
        }


        .welcome h2 {

            color: #172554;

            font-size: 26px;

            margin-bottom: 10px;
        }


        .welcome p {

            color: #64748b;

            font-size: 15px;
        }


        /* =========================
           MESSAGES
        ========================= */

        .message {

            display: flex;

            margin-bottom: 20px;

            animation: appear 0.2s ease;
        }


        @keyframes appear {

            from {

                opacity: 0;

                transform: translateY(5px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        .message.user {

            justify-content: flex-end;
        }


        .message.bot {

            justify-content: flex-start;
        }


        .bubble {

            max-width: 75%;

            padding: 14px 17px;

            border-radius: 15px;

            line-height: 1.5;

            font-size: 14px;

            white-space: pre-wrap;
        }


        .user .bubble {

            background: #2563eb;

            color: white;

            border-bottom-right-radius: 4px;
        }


        .bot .bubble {

            background: white;

            color: #1e293b;

            border: 1px solid #e2e8f0;

            border-bottom-left-radius: 4px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        }


        /* =========================
           QUICK QUESTIONS
        ========================= */

        .quick-area {

            padding: 15px 25px;

            background: white;

            border-top: 1px solid #e5e7eb;
        }


        .quick-title {

            font-size: 12px;

            color: #64748b;

            margin-bottom: 10px;
        }


        .quick-buttons {

            display: flex;

            gap: 8px;

            overflow-x: auto;
        }


        .quick-button {

            white-space: nowrap;

            padding: 9px 13px;

            border-radius: 20px;

            border: 1px solid #dbeafe;

            background: #eff6ff;

            color: #2563eb;

            cursor: pointer;

            font-size: 12px;

            transition: 0.2s;
        }


        .quick-button:hover {

            background: #dbeafe;
        }


        /* =========================
           INPUT
        ========================= */

        .input-area {

            padding: 15px 20px;

            background: white;

            border-top: 1px solid #e5e7eb;

            display: flex;

            gap: 10px;
        }


        #messageInput {

            flex: 1;

            border: 1px solid #dbe2f0;

            border-radius: 13px;

            padding: 14px 16px;

            outline: none;

            font-size: 14px;

            background: #f8fafc;

            color: #172033;
        }


        #messageInput:focus {

            border-color: #2563eb;

            background: white;
        }


        #sendButton {

            width: 50px;

            border: none;

            border-radius: 13px;

            background: #2563eb;

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;
        }


        #sendButton:hover {

            background: #1d4ed8;

            transform: translateY(-1px);
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            font-size: 11px;

            color: #94a3b8;

            padding: 8px;

            background: white;
        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark {

            background: #020617;
        }


        body.dark .app {

            background: #0f172a;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);
        }


        body.dark .chat-area {

            background: #0f172a;
        }


        body.dark .welcome h2 {

            color: #e2e8f0;
        }


        body.dark .welcome p {

            color: #94a3b8;
        }


        body.dark .bot .bubble {

            background: #1e293b;

            color: #e2e8f0;

            border-color: #334155;
        }


        body.dark .quick-area {

            background: #0f172a;

            border-color: #334155;
        }


        body.dark .quick-button {

            background: #172554;

            border-color: #1e40af;

            color: #93c5fd;
        }


        body.dark .input-area {

            background: #0f172a;

            border-color: #334155;
        }


        body.dark #messageInput {

            background: #1e293b;

            color: white;

            border-color: #475569;
        }


        body.dark #messageInput::placeholder {

            color: #94a3b8;
        }


        body.dark .footer {

            background: #0f172a;

            color: #64748b;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:700px) {

            body {

                align-items: stretch;
            }


            .app {

                width: 100%;

                height: 100vh;

                border-radius: 0;
            }


            .header {

                padding: 14px;
            }


            .header-title h1 {

                font-size: 16px;
            }


            .header-title p {

                font-size: 11px;
            }


            .online {

                display: none;
            }


            .header-button {

                width: 34px;

                height: 34px;

                font-size: 15px;
            }


            .chat-area {

                padding: 20px 15px;
            }


            .bubble {

                max-width: 88%;
            }


            .quick-area {

                padding: 12px;
            }
        }

    </style>

</head>


<body>

<div class="app">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">


        <div class="header-left">

            <div class="logo">
                🎓
            </div>


            <div class="header-title">

                <h1>
                    TNEA Counselling Assistant
                </h1>

                <p>
                    Tamil Nadu Engineering Admissions
                </p>

            </div>

        </div>


        <div class="header-right">


            <div class="online">

                <span class="online-dot"></span>

                Online

            </div>


            <!-- Dark Mode -->

            <button
                class="header-button"
                onclick="toggleDarkMode()"
                title="Dark Mode">

                🌙

            </button>


            <!-- New Chat -->

            <button
                class="header-button"
                onclick="newChat()"
                title="New Chat">

                🔄

            </button>


            <!-- Clear -->

            <button
                class="header-button"
                onclick="clearChat()"
                title="Clear Chat">

                🗑️

            </button>


        </div>

    </header>



    <!-- =========================
         CHAT
    ========================== -->

    <main
        class="chat-area"
        id="chatArea">


        <div
            class="welcome"
            id="welcomeMessage">

            <div class="welcome-icon">
                🎓
            </div>

            <h2>
                Welcome to TNEA Assistant
            </h2>

            <p>
                Ask me about colleges, branches,
                cutoffs and counselling.
            </p>

        </div>


    </main>



    <!-- =========================
         QUICK QUESTIONS
    ========================== -->

    <section class="quick-area">

        <div class="quick-title">

            Quick Questions

        </div>


        <div class="quick-buttons">


            <button
                class="quick-button"
                onclick="quickQuestion('What is TNEA counselling?')">

                What is TNEA?

            </button>


            <button
                class="quick-button"
                onclick="quickQuestion('What is TNEA cutoff?')">

                What is cutoff?

            </button>


            <button
                class="quick-button"
                onclick="quickQuestion('What branches are available?')">

                Branches

            </button>


            <button
                class="quick-button"
                onclick="quickQuestion('Which colleges can I get?')">

                Colleges

            </button>


            <button
                class="quick-button"
                onclick="quickQuestion('Explain TNEA counselling process')">

                Counselling Process

            </button>


        </div>

    </section>



    <!-- =========================
         INPUT
    ========================== -->

    <div class="input-area">


        <input
            type="text"
            id="messageInput"
            placeholder="Ask your TNEA question..."
            autocomplete="off">


        <button
            id="sendButton"
            onclick="sendMessage()">

            ➤

        </button>


    </div>



    <div class="footer">

        TNEA Assistant • Based on available 2025
        counselling data • Predictions are estimates

    </div>


</div>



<script>


/* ==========================================
   GET ELEMENTS
========================================== */

const input =
    document.getElementById("messageInput");

const chatArea =
    document.getElementById("chatArea");



/* ==========================================
   SEND MESSAGE WITH ENTER
========================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);



/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    /* Remove welcome */

    const welcome =
        document.getElementById("welcomeMessage");

    if (welcome) {

        welcome.remove();

    }


    /* Show user message */

    addMessage(
        message,
        "user"
    );


    input.value = "";


    /* Show typing */

    const typing =
        addTyping();


    try {


        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    message: message

                })

            });


        const data =
            await response.json();


        typing.remove();


        if (data.response) {

            addMessage(
                data.response,
                "bot"
            );

        }

        else if (data.message) {

            addMessage(
                data.message,
                "bot"
            );

        }

        else {

            addMessage(
                "Sorry, I couldn't understand the response.",
                "bot"
            );

        }


    }

    catch (error) {


        console.error(error);


        typing.remove();


        addMessage(

            "⚠️ I couldn't connect to the chatbot server. " +
            "Please make sure Flask is running.",

            "bot"

        );

    }


    scrollToBottom();

}



/* ==========================================
   ADD MESSAGE
========================================== */

function addMessage(
    text,
    sender
) {


    const message =
        document.createElement("div");


    message.className =
        "message " + sender;


    const bubble =
        document.createElement("div");


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chatArea.appendChild(
        message
    );


    scrollToBottom();

}



/* ==========================================
   TYPING INDICATOR
========================================== */

function addTyping() {


    const message =
        document.createElement("div");


    message.className =
        "message bot";


    const bubble =
        document.createElement("div");


    bubble.className =
        "bubble";


    bubble.textContent =
        "🤖 Typing...";


    message.appendChild(
        bubble
    );


    chatArea.appendChild(
        message
    );


    scrollToBottom();


    return message;

}



/* ==========================================
   QUICK QUESTIONS
========================================== */

function quickQuestion(
    question
) {


    input.value =
        question;


    sendMessage();

}



/* ==========================================
   CLEAR CHAT
========================================== */

function clearChat() {


    const confirmClear =
        confirm(
            "Are you sure you want to clear this chat?"
        );


    if (!confirmClear) {

        return;

    }


    chatArea.innerHTML = `

        <div
            class="welcome"
            id="welcomeMessage">

            <div class="welcome-icon">
                🎓
            </div>

            <h2>
                Welcome to TNEA Assistant
            </h2>

            <p>
                Ask me about colleges, branches,
                cutoffs and counselling.
            </p>

        </div>

    `;

}



/* ==========================================
   NEW CHAT / REFRESH
========================================== */

function newChat() {

    location.reload();

}



/* ==========================================
   DARK MODE
========================================== */

function toggleDarkMode() {


    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "tneaDarkMode",
        dark ? "true" : "false"
    );

}



/* ==========================================
   LOAD DARK MODE
========================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {


        const dark =
            localStorage.getItem(
                "tneaDarkMode"
            );


        if (dark === "true") {

            document.body.classList.add(
                "dark"
            );

        }

    }
);



/* ==========================================
   SCROLL
========================================== */

function scrollToBottom() {

    chatArea.scrollTop =
        chatArea.scrollHeight;

}


</script>


</body>

</html>
